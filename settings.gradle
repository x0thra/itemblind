pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false
}

rootProject.name = 'itemblind'
include '26.2'
include '26.1'
